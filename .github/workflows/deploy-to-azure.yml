name: Build and Deploy to Azure

on:
  push:
    branches:
      - dev

jobs:
  deploy-web-api:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies (Web Api)
        run: dotnet restore src/Gdn.Web.Api.Vs/Gdn.Web.Api.Vs.csproj

      - name: Build (Web Api)
        run: dotnet build src/Gdn.Web.Api.Vs/Gdn.Web.Api.Vs.csproj --configuration Release --no-restore

      - name: Publish (Web Api)
        run: dotnet publish src/Gdn.Web.Api.Vs/Gdn.Web.Api.Vs.csproj --configuration Release --output ./publish

      - name: Deploy to Azure Web App (Web Api)
        uses: azure/webapps-deploy@v3
        with:
          app-name: gdnwebapiwindemo
          publish-profile: ${{ secrets.AZURE_WEBAPI_PUBLISH_PROFILE }}
          package: ./publish

  deploy-blazor:
    runs-on: ubuntu-latest
    needs: deploy-web-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set BackendUrl for production (Blazor App)
        shell: pwsh
        run: |
          $json = Get-Content src/Gdn.Web.MudBlazor/wwwroot/appsettings.json | ConvertFrom-Json
          $json.BackendUrl = "https://gdnwebapiwindemo.azurewebsites.net/api/"
          $json | ConvertTo-Json | Set-Content src/Gdn.Web.MudBlazor/wwwroot/appsettings.json

      - name: Restore dependencies (Blazor App)
        run: dotnet restore src/Gdn.Web.MudBlazor/Gdn.Web.MudBlazor.csproj

      - name: Publish (Blazor App)
        run: dotnet publish src/Gdn.Web.MudBlazor/Gdn.Web.MudBlazor.csproj --configuration Release --no-restore --output ./publish-blazor

      - name: Deploy to Azure Static Web App (Blazor App)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "publish-blazor/wwwroot"
          skip_app_build: true
          output_location: ""